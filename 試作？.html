<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ロキシークラブ - 美容室予約管理システム</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tailwind CSS Custom Color Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        salon: {
                            50: '#FDFBF7',
                            100: '#F7F3EC',
                            200: '#EFE7DB',
                            300: '#E1D3C1',
                            400: '#CDA282',
                            500: '#B88258',
                            600: '#99633F',
                            700: '#7B4C2F',
                            800: '#4D3321',
                            900: '#2C1B10',
                            dark: '#1A1817',
                            accent: '#D4AF37'
                        }
                    },
                    fontFamily: {
                        sans: ['"Inter"', '"Noto Sans JP"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- React & React-DOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel CDN for inline JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            background-color: #F8F7F5;
            color: #2D2B2A;
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #F1ECE6;
        }
        ::-webkit-scrollbar-thumb {
            background: #D5C8B8;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #B8A894;
        }
    </style>
</head>
<body class="h-full overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- SAMPLE INITIAL DATA ---
        const INITIAL_SETTINGS = {
            shopName: 'ロキシークラブ 表参道店',
            phone: '03-5412-8899',
            address: '東京都渋谷区神宮前 4-12-10 ROXYビル 2F',
            openTime: '09:00',
            closeTime: '19:00',
            closedDays: ['火曜日']
        };

        const INITIAL_CUSTOMERS = [
            { id: 'c1', name: '山田 太郎', phone: '090-1234-5678', email: 'yamada@example.com', memo: '右側のクセが強め。アッシュ系カラー好み。', visit_count: 5, total_spent: 45000, last_visit_date: '2026-10-01' },
            { id: 'c2', name: '佐藤 花子', phone: '080-9876-5432', email: 'hanako.s@example.com', memo: '頭皮が敏感なので低刺激オキシ使用。', visit_count: 3, total_spent: 27000, last_visit_date: '2026-09-20' },
            { id: 'c3', name: '鈴木 一郎', phone: '090-5555-4444', email: 'suzuki.i@example.com', memo: 'ショートカット得意メニュー指定。', visit_count: 8, total_spent: 32000, last_visit_date: '2026-10-05' },
            { id: 'c4', name: '田中 美咲', phone: '070-1122-3344', email: 'misaki.t@example.com', memo: '次回トリートメント提案予定。', visit_count: 2, total_spent: 18000, last_visit_date: '2026-08-15' },
            { id: 'c5', name: '伊藤 順子', phone: '090-8877-6655', email: 'ito.j@example.com', memo: '平日午前中の来店が多い。', visit_count: 12, total_spent: 108000, last_visit_date: '2026-09-28' }
        ];

        const INITIAL_MENUS = [
            { id: 'm1', name: 'デザインカット', category: 'カット', price: 4000, duration: 60, description: '骨格に合わせた似合わせカット' },
            { id: 'm2', name: 'フルカラー', category: 'カラー', price: 6000, duration: 90, description: 'ダメージレスオーガニックカラー' },
            { id: 'm3', name: 'カット ＋ カラーセット', category: 'セット', price: 9000, duration: 120, description: '人気No.1のお得なセットコース' },
            { id: 'm4', name: 'デザインパーマ', category: 'パーマ', price: 8000, duration: 120, description: 'ふんわり優しいカールを出すパーマ' },
            { id: 'm5', name: '髪質改善トリートメント', category: 'ケア', price: 3000, duration: 30, description: '超音波アイロンを使用した深層ケア' },
            { id: 'm6', name: 'オーガニックヘッドスパ', category: 'ケア', price: 4500, duration: 45, description: '頭皮の頭皮疲労回復＆リフレッシュ' }
        ];

        const TODAY_STR = '2026-10-07';

        const INITIAL_RESERVATIONS = [
            { id: 'r1', customer_id: 'c1', menu_id: 'm3', reservation_date: TODAY_STR, start_time: '09:00', end_time: '11:00', price: 9000, status: '会計済み', memo: '秋色オリーブアッシュにする' },
            { id: 'r2', customer_id: 'c3', menu_id: 'm1', reservation_date: TODAY_STR, start_time: '11:00', end_time: '12:00', price: 4000, status: '施術中', memo: 'サイドすっきり' },
            { id: 'r3', customer_id: 'c2', menu_id: 'm2', reservation_date: TODAY_STR, start_time: '13:00', end_time: '14:30', price: 6000, status: '来店済み', memo: '明るめ希望' },
            { id: 'r4', customer_id: 'c4', menu_id: 'm4', reservation_date: TODAY_STR, start_time: '15:00', end_time: '17:00', price: 8000, status: '予約済み', memo: '強めカール' },
            { id: 'r5', customer_id: 'c5', menu_id: 'm5', reservation_date: TODAY_STR, start_time: '17:30', end_time: '18:00', price: 3000, status: '予約済み', memo: 'トリートメントのみ' },
            { id: 'r6', customer_id: 'c2', menu_id: 'm1', reservation_date: '2026-10-08', start_time: '10:00', end_time: '11:00', price: 4000, status: '予約済み', memo: '' }
        ];

        // --- HELPER UTILS ---
        const formatYen = (amount) => `¥${Number(amount || 0).toLocaleString()}`;
        
        const timeToMinutes = (timeStr) => {
            if (!timeStr) return 0;
            const [h, m] = timeStr.split(':').map(Number);
            return h * 60 + m;
        };

        const minutesToTime = (totalMin) => {
            const h = Math.floor(totalMin / 60);
            const m = totalMin % 60;
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
        };

        const getStatusBadgeClass = (status) => {
            switch(status) {
                case '予約済み': return 'bg-blue-50 text-blue-700 border-blue-200';
                case '来店済み': return 'bg-amber-50 text-amber-700 border-amber-200';
                case '施術中': return 'bg-purple-50 text-purple-700 border-purple-200';
                case '会計済み': return 'bg-emerald-50 text-emerald-700 border-emerald-200';
                case 'キャンセル': return 'bg-rose-50 text-rose-700 border-rose-200';
                default: return 'bg-gray-50 text-gray-700 border-gray-200';
            }
        };

        // --- MAIN APP COMPONENT ---
        function App() {
            const [activeTab, setActiveTab] = useState('home');
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);

            // Persistent Local Storage Data Initialization
            const [settings, setSettings] = useState(() => {
                const saved = localStorage.getItem('roxy_settings');
                return saved ? JSON.parse(saved) : INITIAL_SETTINGS;
            });

            const [customers, setCustomers] = useState(() => {
                const saved = localStorage.getItem('roxy_customers');
                return saved ? JSON.parse(saved) : INITIAL_CUSTOMERS;
            });

            const [menus, setMenus] = useState(() => {
                const saved = localStorage.getItem('roxy_menus');
                return saved ? JSON.parse(saved) : INITIAL_MENUS;
            });

            const [reservations, setReservations] = useState(() => {
                const saved = localStorage.getItem('roxy_reservations');
                return saved ? JSON.parse(saved) : INITIAL_RESERVATIONS;
            });

            // Dialog / Modal state
            const [modalState, setModalState] = useState({ type: null, data: null });
            const [toastMessage, setToastMessage] = useState(null);
            const [targetCustomerIdForView, setTargetCustomerIdForView] = useState(null);
            const [presetReservationCustomer, setPresetReservationCustomer] = useState(null);

            // Sync with local storage
            useEffect(() => { localStorage.setItem('roxy_settings', JSON.stringify(settings)); }, [settings]);
            useEffect(() => { localStorage.setItem('roxy_customers', JSON.stringify(customers)); }, [customers]);
            useEffect(() => { localStorage.setItem('roxy_menus', JSON.stringify(menus)); }, [menus]);
            useEffect(() => { localStorage.setItem('roxy_reservations', JSON.stringify(reservations)); }, [reservations]);

            // Icons render helper
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            // Customer Stats Calculation Engine
            const recalculateCustomerStats = (custs, resvs) => {
                return custs.map(cust => {
                    const custResvs = resvs.filter(r => r.customer_id === cust.id && r.status === '会計済み');
                    const visit_count = custResvs.length;
                    const total_spent = custResvs.reduce((sum, r) => sum + Number(r.price || 0), 0);
                    
                    let last_visit_date = cust.last_visit_date;
                    if (custResvs.length > 0) {
                        const sortedDates = custResvs.map(r => r.reservation_date).sort().reverse();
                        last_visit_date = sortedDates[0];
                    }
                    return { ...cust, visit_count, total_spent, last_visit_date };
                });
            };

            // Status updates for reservation
            const updateReservationStatus = (resId, newStatus) => {
                const updatedResvs = reservations.map(r => r.id === resId ? { ...r, status: newStatus } : r);
                setReservations(updatedResvs);
                const updatedCusts = recalculateCustomerStats(customers, updatedResvs);
                setCustomers(updatedCusts);
                showToast(`予約ステータスを「${newStatus}」に変更しました`);
            };

            // Direct actions
            const openNewReservation = (preselectedCust = null) => {
                setPresetReservationCustomer(preselectedCust);
                setModalState({ type: 'reservation_form', data: null });
            };

            const openCustomerDetail = (custId) => {
                setTargetCustomerIdForView(custId);
                setActiveTab('customers');
            };

            return (
                <div className="min-h-screen flex flex-col md:flex-row bg-[#F8F7F5] text-stone-800">
                    {/* Toast Notification */}
                    {toastMessage && (
                        <div className="fixed top-5 right-5 z-50 bg-stone-900 text-stone-100 px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 text-sm font-medium transition-all transform animate-bounce">
                            <i data-lucide="check-circle" className="w-5 h-5 text-emerald-400"></i>
                            <span>{toastMessage}</span>
                        </div>
                    )}

                    {/* Mobile Navigation Header */}
                    <div className="md:hidden bg-stone-900 text-stone-100 px-4 py-3 flex items-center justify-between shadow-md">
                        <div className="flex items-center space-x-2">
                            <div className="w-8 h-8 rounded-lg bg-salon-400 flex items-center justify-center text-stone-900 font-bold text-lg">R</div>
                            <span className="font-semibold text-lg tracking-wide font-serif">ロキシークラブ</span>
                        </div>
                        <button 
                            onClick={() => setIsSidebarOpen(!isSidebarOpen)}
                            className="p-2 text-stone-300 hover:text-white focus:outline-none"
                        >
                            <i data-lucide={isSidebarOpen ? "x" : "menu"} className="w-6 h-6"></i>
                        </button>
                    </div>

                    {/* Sidebar */}
                    <aside className={`
                        fixed md:static inset-y-0 left-0 z-40 w-64 bg-stone-900 text-stone-300 flex flex-col justify-between
                        transform ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'} md:translate-x-0 transition-transform duration-300 ease-in-out shadow-xl
                    `}>
                        <div>
                            {/* Logo */}
                            <div className="p-6 flex items-center space-x-3 border-b border-stone-800">
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-salon-300 to-salon-500 flex items-center justify-center text-stone-900 font-extrabold text-xl shadow-inner">
                                    R
                                </div>
                                <div>
                                    <h1 className="text-stone-100 font-bold text-lg font-serif tracking-wider">ロキシークラブ</h1>
                                    <p className="text-xs text-stone-400">サロン管理システム</p>
                                </div>
                            </div>

                            {/* Nav List */}
                            <nav className="px-4 py-6 space-y-1.5">
                                {[
                                    { id: 'home', label: 'ホーム', icon: 'layout-dashboard' },
                                    { id: 'reservations', label: '予約管理', icon: 'calendar' },
                                    { id: 'customers', label: '顧客管理', icon: 'users' },
                                    { id: 'menus', label: 'メニュー管理', icon: 'scissors' },
                                    { id: 'sales', label: '売上管理', icon: 'trending-up' },
                                    { id: 'settings', label: '設定', icon: 'settings' }
                                ].map(item => {
                                    const active = activeTab === item.id;
                                    return (
                                        <button
                                            key={item.id}
                                            onClick={() => {
                                                setActiveTab(item.id);
                                                setIsSidebarOpen(false);
                                            }}
                                            className={`
                                                w-full flex items-center space-x-3.5 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200
                                                ${active 
                                                    ? 'bg-salon-500 text-white shadow-md font-semibold' 
                                                    : 'text-stone-400 hover:bg-stone-800 hover:text-stone-200'}
                                            `}
                                        >
                                            <i data-lucide={item.icon} className={`w-5 h-5 ${active ? 'text-white' : 'text-stone-400'}`}></i>
                                            <span>{item.label}</span>
                                        </button>
                                    );
                                })}
                            </nav>
                        </div>

                        {/* Shop Info Footer */}
                        <div className="p-4 m-4 rounded-xl bg-stone-800/60 border border-stone-800 text-xs text-stone-400">
                            <p className="font-semibold text-stone-300 truncate">{settings.shopName}</p>
                            <p className="mt-1">営業時間: {settings.openTime} - {settings.closeTime}</p>
                        </div>
                    </aside>

                    {/* Main Content Workspace */}
                    <main className="flex-1 flex flex-col min-w-0 overflow-y-auto min-h-screen">
                        {/* Top Header */}
                        <header className="bg-white border-b border-stone-200 px-6 py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4 sticky top-0 z-30 shadow-sm">
                            <div className="flex items-center space-x-3">
                                <span className="text-xs font-semibold text-salon-600 bg-salon-50 px-2.5 py-1 rounded-md border border-salon-200">
                                    本日
                                </span>
                                <h2 className="text-lg font-bold text-stone-800">
                                    2026年10月7日 (水)
                                </h2>
                            </div>

                            <div className="flex items-center space-x-3">
                                <button 
                                    onClick={() => openNewReservation()}
                                    className="bg-stone-900 hover:bg-stone-800 text-white font-medium px-4 py-2.5 rounded-xl text-sm shadow-md flex items-center space-x-2 transition hover:shadow-lg"
                                >
                                    <i data-lucide="plus" className="w-4 h-4 text-salon-400"></i>
                                    <span>予約を登録</span>
                                </button>
                            </div>
                        </header>

                        {/* Dynamic Active Tab View Content */}
                        <div className="p-4 sm:p-6 lg:p-8 flex-1 max-w-7xl w-full mx-auto">
                            {activeTab === 'home' && (
                                <HomeView 
                                    reservations={reservations}
                                    customers={customers}
                                    menus={menus}
                                    onOpenReservationDetail={(r) => setModalState({ type: 'reservation_detail', data: r })}
                                    onOpenNewReservation={() => openNewReservation()}
                                    onGoToReservations={() => setActiveTab('reservations')}
                                />
                            )}

                            {activeTab === 'reservations' && (
                                <ReservationsView 
                                    reservations={reservations}
                                    customers={customers}
                                    menus={menus}
                                    settings={settings}
                                    onOpenDetail={(r) => setModalState({ type: 'reservation_detail', data: r })}
                                    onOpenNewReservation={() => openNewReservation()}
                                />
                            )}

                            {activeTab === 'customers' && (
                                <CustomersView 
                                    customers={customers}
                                    reservations={reservations}
                                    menus={menus}
                                    initialSelectedCustId={targetCustomerIdForView}
                                    onClearInitialCustId={() => setTargetCustomerIdForView(null)}
                                    onAddCustomer={(newCust) => {
                                        setCustomers([newCust, ...customers]);
                                        showToast('新しい顧客を登録しました');
                                    }}
                                    onOpenNewReservationForCust={(cust) => openNewReservation(cust)}
                                />
                            )}

                            {activeTab === 'menus' && (
                                <MenusView 
                                    menus={menus}
                                    onSaveMenu={(menuData) => {
                                        if (menuData.id) {
                                            setMenus(menus.map(m => m.id === menuData.id ? menuData : m));
                                            showToast('メニューを更新しました');
                                        } else {
                                            const newM = { ...menuData, id: 'm_' + Date.now() };
                                            setMenus([...menus, newM]);
                                            showToast('新規メニューを追加しました');
                                        }
                                    }}
                                    onDeleteMenu={(mId) => {
                                        setMenus(menus.filter(m => m.id !== mId));
                                        showToast('メニューを削除しました');
                                    }}
                                />
                            )}

                            {activeTab === 'sales' && (
                                <SalesView 
                                    reservations={reservations}
                                    customers={customers}
                                    menus={menus}
                                />
                            )}

                            {activeTab === 'settings' && (
                                <SettingsView 
                                    settings={settings}
                                    onSaveSettings={(updated) => {
                                        setSettings(updated);
                                        showToast('店舗設定を保存しました');
                                    }}
                                />
                            )}
                        </div>
                    </main>

                    {/* MODAL DIALOG CONTROLLER */}
                    {modalState.type === 'reservation_form' && (
                        <ReservationFormModal 
                            customers={customers}
                            menus={menus}
                            reservations={reservations}
                            settings={settings}
                            preselectedCustomer={presetReservationCustomer}
                            onClose={() => {
                                setModalState({ type: null, data: null });
                                setPresetReservationCustomer(null);
                            }}
                            onSave={(resData) => {
                                if (resData.id) {
                                    setReservations(reservations.map(r => r.id === resData.id ? resData : r));
                                    showToast('予約内容を更新しました');
                                } else {
                                    const newRes = { ...resData, id: 'r_' + Date.now() };
                                    const updatedResvs = [...reservations, newRes];
                                    setReservations(updatedResvs);
                                    if (newRes.status === '会計済み') {
                                        setCustomers(recalculateCustomerStats(customers, updatedResvs));
                                    }
                                    showToast('新規予約を登録しました');
                                }
                                setModalState({ type: null, data: null });
                                setPresetReservationCustomer(null);
                            }}
                            onAddNewCustomerInline={(custData) => {
                                const newC = { ...custData, id: 'c_' + Date.now(), visit_count: 0, total_spent: 0, last_visit_date: '-' };
                                setCustomers([...customers, newC]);
                                showToast('顧客登録完了');
                                return newC;
                            }}
                        />
                    )}

                    {modalState.type === 'reservation_detail' && (
                        <ReservationDetailModal 
                            reservation={modalState.data}
                            customers={customers}
                            menus={menus}
                            onClose={() => setModalState({ type: null, data: null })}
                            onStatusChange={(resId, newStatus) => {
                                updateReservationStatus(resId, newStatus);
                                setModalState({ type: null, data: null });
                            }}
                            onEdit={(res) => {
                                setModalState({ type: 'reservation_form', data: res });
                            }}
                            onCancel={(resId) => {
                                updateReservationStatus(resId, 'キャンセル');
                                setModalState({ type: null, data: null });
                            }}
                            onNavigateToCustomer={(custId) => {
                                setModalState({ type: null, data: null });
                                openCustomerDetail(custId);
                            }}
                        />
                    )}
                </div>
            );
        }

        function HomeView({ reservations, customers, menus, onOpenReservationDetail, onOpenNewReservation, onGoToReservations }) {
            const todayResvs = useMemo(() => {
                return reservations.filter(r => r.reservation_date === TODAY_STR);
            }, [reservations]);

            const todayTotalCount = todayResvs.filter(r => r.status !== 'キャンセル').length;
            const visitedCount = todayResvs.filter(r => r.status === '来店済み' || r.status === '施術中' || r.status === '会計済み').length;
            const remainingCount = todayResvs.filter(r => r.status === '予約済み').length;
            
            const todaySales = todayResvs
                .filter(r => r.status === '会計済み')
                .reduce((sum, r) => sum + Number(r.price || 0), 0);

            // Next upcoming reservation logic
            const nextReservation = useMemo(() => {
                const upcoming = todayResvs.filter(r => r.status === '予約済み');
                if (upcoming.length === 0) return null;
                return upcoming.sort((a, b) => a.start_time.localeCompare(b.start_time))[0];
            }, [todayResvs]);

            const getCustomerName = (id) => customers.find(c => c.id === id)?.name || '未登録顧客';
            const getMenuName = (id) => menus.find(m => m.id === id)?.name || '未登録メニュー';

            return (
                <div className="space-y-6">
                    {/* Welcome Bar */}
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-gradient-to-r from-stone-900 via-stone-800 to-stone-900 p-6 rounded-2xl text-white shadow-xl">
                        <div>
                            <p className="text-salon-300 font-medium text-xs tracking-wider uppercase">ROXY CLUB SALON DASHBOARD</p>
                            <h2 className="text-2xl font-bold font-serif mt-1">本日のサロンステータス</h2>
                            <p className="text-stone-300 text-sm mt-1">お客様の笑顔とスムーズな営業をサポートします。</p>
                        </div>
                        <button 
                            onClick={onOpenNewReservation}
                            className="bg-salon-500 hover:bg-salon-400 text-white font-medium px-5 py-2.5 rounded-xl text-sm shadow-lg flex items-center space-x-2 transition"
                        >
                            <i data-lucide="plus-circle" className="w-5 h-5"></i>
                            <span>新規予約を登録</span>
                        </button>
                    </div>

                    {/* KPI Cards Grid */}
                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6">
                        <div className="bg-white p-5 rounded-2xl border border-stone-200/80 shadow-sm flex flex-col justify-between">
                            <div className="flex items-center justify-between text-stone-500">
                                <span className="text-xs font-semibold uppercase tracking-wider">本日の予約</span>
                                <div className="p-2 rounded-xl bg-blue-50 text-blue-600"><i data-lucide="calendar" className="w-5 h-5"></i></div>
                            </div>
                            <div className="mt-4">
                                <div className="text-3xl font-extrabold text-stone-800">{todayTotalCount}<span className="text-sm font-medium text-stone-500 ml-1">件</span></div>
                            </div>
                        </div>

                        <div className="bg-white p-5 rounded-2xl border border-stone-200/80 shadow-sm flex flex-col justify-between">
                            <div className="flex items-center justify-between text-stone-500">
                                <span className="text-xs font-semibold uppercase tracking-wider">来店済み</span>
                                <div className="p-2 rounded-xl bg-emerald-50 text-emerald-600"><i data-lucide="user-check" className="w-5 h-5"></i></div>
                            </div>
                            <div className="mt-4">
                                <div className="text-3xl font-extrabold text-emerald-600">{visitedCount}<span className="text-sm font-medium text-stone-500 ml-1">人</span></div>

                        <div className="bg-white p-5 rounded-2xl border border-stone-200/80 shadow-sm flex flex-col justify-between">

                                <span className="text-xs font-semibold uppercase tracking-wider">残り予約</span>
                                <div className="p-2 rounded-xl bg-amber-50 text-amber-600"><i data-lucide="clock" className="w-5 h-5"></i></div>
                            </div>
                            <div className="mt-4">
                                <div className="text-3xl font-extrabold text-amber-600">{remainingCount}<span className="text-sm font-medium text-stone-500 ml-1">件</span></div>
                            </div>
                        </div>

                        <div className="bg-white p-5 rounded-2xl border border-stone-200/80 shadow-sm flex flex-col justify-between">
                            <div className="flex items-center justify-between text-stone-500">
                                <span className="text-xs font-semibold uppercase tracking-wider">本日の売上</span>
                                <div className="p-2 rounded-xl bg-salon-50 text-salon-600"><i data-lucide="banknote" className="w-5 h-5"></i></div>
                            </div>
                            <div className="mt-4">
                                <div className="text-2xl sm:text-3xl font-extrabold text-stone-900">{formatYen(todaySales)}</div>
                            </div>
                        </div>
                    </div>

                    {/* Next Reservation Banner */}
                    {nextReservation && (
                        <div className="bg-amber-50/80 border border-amber-200 p-5 rounded-2xl shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                            <div className="flex items-center space-x-4">
                                <div className="p-3 bg-amber-500 text-white rounded-xl font-bold text-center">
                                    <span className="text-xs block uppercase">NEXT</span>
                                    <span className="text-sm">{nextReservation.start_time}</span>
                                </div>
                                <div>
                                    <span className="text-xs text-amber-800 font-semibold">次の来店予定</span>
                                    <h3 className="text-lg font-bold text-stone-900">
                                        {getCustomerName(nextReservation.customer_id)} 様
                                    </h3>
                                    <p className="text-xs text-stone-600 mt-0.5">
                                        {getMenuName(nextReservation.menu_id)} （{formatYen(nextReservation.price)}）
                                    </p>
                                </div>
                            </div>
                            <button 
                                onClick={() => onOpenReservationDetail(nextReservation)}
                                className="bg-white hover:bg-amber-100 text-amber-900 border border-amber-300 font-medium px-4 py-2 rounded-xl text-xs shadow-sm transition"
                            >
                                詳細を確認
                            </button>
                        </div>
                    )}

                    {/* Today's Schedule Table */}
                    <div className="bg-white rounded-2xl border border-stone-200/80 shadow-sm overflow-hidden">
                        <div className="p-5 border-b border-stone-100 flex items-center justify-between">
                            <h3 className="font-bold text-stone-800 text-base flex items-center space-x-2">
                                <i data-lucide="list-todo" className="w-5 h-5 text-salon-600"></i>
                                <span>本日の予約一覧</span>
                            </h3>
                            <button 
                                onClick={onGoToReservations}
                                className="text-xs font-semibold text-salon-600 hover:text-salon-800 flex items-center space-x-1"
                            >
                                <span>タイムライン表示へ</span>
                                <i data-lucide="chevron-right" className="w-4 h-4"></i>
                            </button>
                        </div>

                        {todayResvs.length === 0 ? (
                            <div className="p-10 text-center text-stone-400">
                                <i data-lucide="calendar-x" className="w-12 h-12 mx-auto mb-3 opacity-40"></i>
                                <p>本日の予約は入っていません</p>
                            </div>
                        ) : (
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm border-collapse">
                                    <thead>
                                        <tr className="bg-stone-50 text-stone-500 font-medium text-xs border-b border-stone-100">
                                            <th className="p-4 pl-6">時間</th>
                                            <th className="p-4">お客様名</th>
                                            <th className="p-4">施術メニュー</th>
                                            <th className="p-4">料金</th>
                                            <th className="p-4">ステータス</th>
                                            <th className="p-4 pr-6 text-right">操作</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-stone-100">
                                        {todayResvs.sort((a,b) => a.start_time.localeCompare(b.start_time)).map(r => (
                                            <tr key={r.id} className="hover:bg-stone-50/80 transition">
                                                <td className="p-4 pl-6 font-semibold text-stone-700 whitespace-nowrap">
                                                    {r.start_time} - {r.end_time}
                                                </td>
                                                <td className="p-4 font-bold text-stone-900 whitespace-nowrap">
                                                    {getCustomerName(r.customer_id)} 様
                                                </td>
                                                <td className="p-4 text-stone-600 max-w-xs truncate">
                                                    {getMenuName(r.menu_id)}
                                                </td>
                                                <td className="p-4 font-semibold text-stone-800 whitespace-nowrap">
                                                    {formatYen(r.price)}
                                                </td>
                                                <td className="p-4 whitespace-nowrap">
                                                    <span className={`inline-block px-3 py-1 rounded-full text-xs font-semibold border ${getStatusBadgeClass(r.status)}`}>
                                                        {r.status}
                                                    </span>
                                                </td>
                                                <td className="p-4 pr-6 text-right whitespace-nowrap">
                                                    <button 
                                                        onClick={() => onOpenReservationDetail(r)}
                                                        className="text-stone-600 hover:text-stone-900 bg-stone-100 hover:bg-stone-200 px-3 py-1.5 rounded-lg text-xs font-medium transition"
                                                    >
                                                        詳細
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function ReservationsView({ reservations, customers, menus, settings, onOpenDetail, onOpenNewReservation }) {
            const [selectedDate, setSelectedDate] = useState(TODAY_STR);

            // Date navigation
            const changeDateByDays = (days) => {
                const curr = new Date(selectedDate);
                curr.setDate(curr.getDate() + days);
                const yyyy = curr.getFullYear();
                const mm = String(curr.getMonth() + 1).padStart(2, '0');
                const dd = String(curr.getDate()).padStart(2, '0');
                setSelectedDate(`${yyyy}-${mm}-${dd}`);
            };

            const dayReservations = useMemo(() => {
                return reservations.filter(r => r.reservation_date === selectedDate);
            }, [reservations, selectedDate]);

            // Hourly Slots (09:00 - 19:00 based on open/close times)
            const hours = useMemo(() => {
                const startH = parseInt(settings.openTime.split(':')[0], 10) || 9;
                const endH = parseInt(settings.closeTime.split(':')[0], 10) || 19;
                const arr = [];
                for(let h = startH; h <= endH; h++) {
                    arr.push(`${String(h).padStart(2, '0')}:00`);
                }
                return arr;
            }, [settings]);

            const getCustomerName = (id) => customers.find(c => c.id === id)?.name || '未登録';
            const getMenuName = (id) => menus.find(m => m.id === id)?.name || '未登録';

            return (
                <div className="space-y-6">
                    {/* Header Bar */}
                    <div className="bg-white p-4 sm:p-6 rounded-2xl border border-stone-200/80 shadow-sm flex flex-col md:flex-row items-center justify-between gap-4">
                        <div className="flex items-center space-x-2 sm:space-x-3 w-full md:w-auto justify-between md:justify-start">
                            <button 
                                onClick={() => changeDateByDays(-1)}
                                className="p-2 border border-stone-200 rounded-xl hover:bg-stone-50 transition"
                            >
                                <i data-lucide="chevron-left" className="w-5 h-5 text-stone-600"></i>
                            </button>

                            <div className="flex items-center space-x-2">
                                <input 
                                    type="date"
                                    value={selectedDate}
                                    onChange={(e) => setSelectedDate(e.target.value)}
                                    className="border border-stone-200 rounded-xl px-3 py-2 text-sm font-bold text-stone-800 focus:outline-none focus:ring-2 focus:ring-salon-500"
                                />
                                <button 
                                    onClick={() => setSelectedDate(TODAY_STR)}
                                    className="bg-stone-100 hover:bg-stone-200 text-stone-700 px-3 py-2 rounded-xl text-xs font-semibold transition"
                                >
                                    今日
                                </button>
                            </div>

                            <button 
                                onClick={() => changeDateByDays(1)}
                                className="p-2 border border-stone-200 rounded-xl hover:bg-stone-50 transition"
                            >
                                <i data-lucide="chevron-right" className="w-5 h-5 text-stone-600"></i>
                            </button>
                        </div>

                        <div className="flex items-center space-x-3 w-full md:w-auto justify-end">
                            <span className="text-xs text-stone-500 font-medium">該当日の予約: {dayReservations.length}件</span>
                            <button 
                                onClick={onOpenNewReservation}
                                className="bg-salon-600 hover:bg-salon-500 text-white font-medium px-4 py-2 rounded-xl text-xs shadow-sm flex items-center space-x-1.5 transition"
                            >
                                <i data-lucide="plus" className="w-4 h-4"></i>
                                <span>予約追加</span>
                            </button>
                        </div>
                    </div>

                    {/* Timeline Schedule View */}
                    <div className="bg-white rounded-2xl border border-stone-200/80 shadow-sm overflow-hidden p-4 sm:p-6">
                        <h3 className="text-sm font-bold text-stone-500 uppercase tracking-wider mb-4 flex items-center space-x-2">
                            <i data-lucide="clock" className="w-4 h-4 text-salon-600"></i>
                            <span>日別タイムライン</span>
                        </h3>

                        <div className="space-y-3">
                            {hours.map(hourSlot => {
                                const slotMin = timeToMinutes(hourSlot);
                                const slotNextMin = slotMin + 60;

                                // Find matching reservations starting in this hour slot
                                const matchingResvs = dayReservations.filter(r => {
                                    const resStart = timeToMinutes(r.start_time);
                                    return resStart >= slotMin && resStart < slotNextMin;
                                });

                                return (
                                    <div key={hourSlot} className="flex items-start space-x-4 p-2 rounded-xl hover:bg-stone-50/60 transition border-b border-stone-100 last:border-0">
                                        <div className="w-16 pt-1 font-mono font-bold text-sm text-stone-500 text-right shrink-0">
                                            {hourSlot}
                                        </div>

                                        <div className="flex-1 space-y-2 min-h-[44px]">
                                            {matchingResvs.length === 0 ? (
                                                <div className="h-10 border border-dashed border-stone-200 rounded-xl flex items-center px-4 text-xs text-stone-300">
                                                    空き枠
                                                </div>
                                            ) : (
                                                matchingResvs.map(res => (
                                                    <div 
                                                        key={res.id}
                                                        onClick={() => onOpenDetail(res)}
                                                        className="bg-stone-900 text-white p-3.5 rounded-xl shadow-sm hover:shadow-md transition cursor-pointer flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-l-4 border-salon-400"
                                                    >
                                                        <div className="flex items-start space-x-3">
                                                            <div className="bg-stone-800 px-2.5 py-1 rounded-lg text-xs font-mono font-bold text-salon-300 whitespace-nowrap">
                                                                {res.start_time} - {res.end_time}
                                                            </div>
                                                            <div>
                                                                <h4 className="font-bold text-sm text-stone-100 flex items-center space-x-2">
                                                                    <span>{getCustomerName(res.customer_id)} 様</span>
                                                                </h4>
                                                                <p className="text-xs text-stone-300 mt-0.5">
                                                                    {getMenuName(res.menu_id)} ({formatYen(res.price)})
                                                                </p>
                                                            </div>
                                                        </div>

                                                        <div className="flex items-center space-x-2 self-end sm:self-center">
                                                            <span className={`px-2.5 py-0.5 rounded-full text-xs font-semibold border ${getStatusBadgeClass(res.status)}`}>
                                                                {res.status}
                                                            </span>
                                                            <i data-lucide="chevron-right" className="w-4 h-4 text-stone-400"></i>
                                                        </div>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        function CustomersView({ customers, reservations, menus, initialSelectedCustId, onClearInitialCustId, onAddCustomer, onOpenNewReservationForCust }) {
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedCustId, setSelectedCustId] = useState(initialSelectedCustId);
            const [isAddingCust, setIsAddingCust] = useState(false);

            // Form state
            const [newCustName, setNewCustName] = useState('');
            const [newCustPhone, setNewCustPhone] = useState('');
            const [newCustEmail, setNewCustEmail] = useState('');
            const [newCustMemo, setNewCustMemo] = useState('');

            useEffect(() => {
                if (initialSelectedCustId) {
                    setSelectedCustId(initialSelectedCustId);
                }
            }, [initialSelectedCustId]);

            const filteredCustomers = useMemo(() => {
                return customers.filter(c => 
                    c.name.includes(searchTerm) || c.phone.includes(searchTerm)
                );
            }, [customers, searchTerm]);

            const selectedCustomer = useMemo(() => {
                return customers.find(c => c.id === selectedCustId);
            }, [customers, selectedCustId]);

            const customerHistory = useMemo(() => {
                if (!selectedCustId) return [];
                return reservations
                    .filter(r => r.customer_id === selectedCustId)
                    .sort((a,b) => b.reservation_date.localeCompare(a.reservation_date));
            }, [reservations, selectedCustId]);

            const handleSubmitNewCust = (e) => {
                e.preventDefault();
                if (!newCustName.trim()) return;
                const created = {
                    id: 'c_' + Date.now(),
                    name: newCustName,
                    phone: newCustPhone,
                    email: newCustEmail,
                    memo: newCustMemo,
                    visit_count: 0,
                    total_spent: 0,
                    last_visit_date: '-'
                };
                onAddCustomer(created);
                setIsAddingCust(false);
                setNewCustName('');
                setNewCustPhone('');
                setNewCustEmail('');
                setNewCustMemo('');
                setSelectedCustId(created.id);
            };

            const getMenuName = (id) => menus.find(m => m.id === id)?.name || '削除済みメニュー';

            return (
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    {/* Left Panel: Customer List */}
                    <div className="lg:col-span-1 bg-white rounded-2xl border border-stone-200/80 shadow-sm flex flex-col h-[700px] overflow-hidden">
                        <div className="p-4 border-b border-stone-100 space-y-3">
                            <div className="flex items-center justify-between">
                                <h3 className="font-bold text-stone-800 text-base">顧客一覧 ({filteredCustomers.length})</h3>
                                <button 
                                    onClick={() => setIsAddingCust(true)}
                                    className="bg-stone-900 hover:bg-stone-800 text-white p-2 rounded-xl shadow transition"
                                >
                                    <i data-lucide="user-plus" className="w-4 h-4"></i>
                                </button>
                            </div>
                            <div className="relative">
                                <i data-lucide="search" className="w-4 h-4 absolute left-3 top-3 text-stone-400"></i>
                                <input 
                                    type="text"
                                    placeholder="名前・電話番号で検索..."
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                    className="w-full pl-9 pr-4 py-2 border border-stone-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-salon-500"
                                />
                            </div>
                        </div>

                        {/* List items */}
                        <div className="flex-1 overflow-y-auto divide-y divide-stone-100">
                            {filteredCustomers.length === 0 ? (
                                <div className="p-8 text-center text-xs text-stone-400">顧客が見つかりません</div>
                            ) : (
                                filteredCustomers.map(cust => {
                                    const isSelected = cust.id === selectedCustId;
                                    return (
                                        <div 
                                            key={cust.id}
                                            onClick={() => setSelectedCustId(cust.id)}
                                            className={`p-4 cursor-pointer transition ${isSelected ? 'bg-salon-50 border-l-4 border-salon-500' : 'hover:bg-stone-50'}`}
                                        >
                                            <div className="flex justify-between items-start">
                                                <h4 className="font-bold text-sm text-stone-900">{cust.name} 様</h4>
                                                <span className="text-[10px] text-stone-400 font-mono">{cust.phone}</span>
                                            </div>
                                            <div className="mt-2 flex items-center justify-between text-xs text-stone-500">
                                                <span>来店: {cust.visit_count}回</span>
                                                <span className="font-semibold text-stone-700">{formatYen(cust.total_spent)}</span>
                                            </div>
                                        </div>
                                    );
                                })
                            )}
                        </div>
                    </div>

                    {/* Right Panel: Detail or New Modal Form */}
                    <div className="lg:col-span-2 bg-white rounded-2xl border border-stone-200/80 shadow-sm p-6 flex flex-col min-h-[700px]">
                        {isAddingCust ? (
                            <div>
                                <div className="flex justify-between items-center pb-4 mb-4 border-b border-stone-100">
                                    <h3 className="font-bold text-lg text-stone-800">新規顧客登録</h3>
                                    <button onClick={() => setIsAddingCust(false)} className="text-stone-400 hover:text-stone-600">
                                        <i data-lucide="x" className="w-5 h-5"></i>
                                    </button>
                                </div>
                                <form onSubmit={handleSubmitNewCust} className="space-y-4 max-w-lg">
                                    <div>
                                        <label className="block text-xs font-bold text-stone-700 mb-1">氏名 <span className="text-rose-500">*</span></label>
                                        <input 
                                            type="text" 
                                            required 
                                            value={newCustName} 
                                            onChange={e => setNewCustName(e.target.value)} 
                                            placeholder="例: 山田 太郎"
                                            className="w-full px-3 py-2 border border-stone-200 rounded-xl text-sm focus:ring-2 focus:ring-salon-500 outline-none"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-stone-700 mb-1">電話番号</label>
                                        <input 
                                            type="tel" 
                                            value={newCustPhone} 
                                            onChange={e => setNewCustPhone(e.target.value)} 
                                            placeholder="例: 090-1234-5678"
                                            className="w-full px-3 py-2 border border-stone-200 rounded-xl text-sm focus:ring-2 focus:ring-salon-500 outline-none"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-stone-700 mb-1">メールアドレス</label>
                                        <input 
                                            type="email" 
                                            value={newCustEmail} 
                                            onChange={e => setNewCustEmail(e.target.value)} 
                                            placeholder="例: customer@example.com"
                                            className="w-full px-3 py-2 border border-stone-200 rounded-xl text-sm focus:ring-2 focus:ring-salon-500 outline-none"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-stone-700 mb-1">メモ・カルテ情報</label>
                                        <textarea 
                                            rows="3" 
                                            value={newCustMemo} 
                                            onChange={e => setNewCustMemo(e.target.value)} 
                                            placeholder="髪質、好み、アレルギーなど"
                                            className="w-full px-3 py-2 border border-stone-200 rounded-xl text-sm focus:ring-2 focus:ring-salon-500 outline-none"
                                        ></textarea>
                                    </div>
                                    <div className="flex space-x-3 pt-2">
                                        <button type="submit" className="bg-stone-900 text-white px-5 py-2.5 rounded-xl text-sm font-semibold shadow hover:bg-stone-800">
                                            保存する
                                        </button>
                                        <button type="button" onClick={() => setIsAddingCust(false)} className="bg-stone-100 text-stone-600 px-4 py-2.5 rounded-xl text-sm font-medium">
                                            キャンセル
                                        </button>
                                    </div>
                                </form>
                            </div>
                        ) : selectedCustomer ? (
                            <div className="space-y-6 flex-1 flex flex-col">
                                {/* Header Card */}
                                <div className="bg-stone-50 p-5 rounded-2xl border border-stone-100 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                                    <div>
                                        <span className="text-xs font-mono text-stone-400">ID: {selectedCustomer.id}</span>
                                        <h2 className="text-xl font-extrabold text-stone-900">{selectedCustomer.name} 様</h2>
                                        <p className="text-xs text-stone-500 mt-1 flex items-center space-x-3">
                                            <span>📞 {selectedCustomer.phone || '未登録'}</span>
                                            <span>✉️ {selectedCustomer.email || '未登録'}</span>
                                        </p>
                                    </div>

                                    <button 
                                        onClick={() => onOpenNewReservationForCust(selectedCustomer)}
                                        className="bg-salon-600 hover:bg-salon-500 text-white font-medium px-4 py-2 rounded-xl text-xs shadow flex items-center space-x-1.5 transition self-start sm:self-center"
                                    >
                                        <i data-lucide="calendar-plus" className="w-4 h-4"></i>
                                        <span>この顧客で予約作成</span>
                                    </button>
                                </div>

                                {/* Stats Grid */}
                                <div className="grid grid-cols-3 gap-4">
                                    <div className="p-4 bg-stone-50 rounded-xl border border-stone-100 text-center">
                                        <span className="text-[11px] text-stone-400 block uppercase font-medium">来店回数</span>
                                        <span className="text-xl font-bold text-stone-800">{selectedCustomer.visit_count} 回</span>
                                    </div>
                                    <div className="p-4 bg-stone-50 rounded-xl border border-stone-100 text-center">
                                        <span className="text-[11px] text-stone-400 block uppercase font-medium">累計利用額</span>
                                        <span className="text-xl font-bold text-salon-600">{formatYen(selectedCustomer.total_spent)}</span>
                                    </div>

        function SalesView({ reservations, customers, menus }) {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            // Filter for Completed Sales
            const completedResvs = useMemo(() => {
                return reservations.filter(r => r.status === '会計済み');
            }, [reservations]);

            // Total KPIs
            const todaySales = useMemo(() => {
                return completedResvs
                    .filter(r => r.reservation_date === TODAY_STR)
                    .reduce((sum, r) => sum + Number(r.price || 0), 0);
            }, [completedResvs]);

            const monthSales = useMemo(() => {
                return completedResvs
                    .filter(r => r.reservation_date.startsWith('2026-10'))
                    .reduce((sum, r) => sum + Number(r.price || 0), 0);
            }, [completedResvs]);

            const monthVisits = useMemo(() => {
                return completedResvs.filter(r => r.reservation_date.startsWith('2026-10')).length;
            }, [completedResvs]);

            const avgCustomerSpend = monthVisits > 0 ? Math.round(monthSales / monthVisits) : 0;

            // Menu breakdown
            const menuSalesBreakdown = useMemo(() => {
                const map = {};
                completedResvs.forEach(r => {
                    const m = menus.find(menu => menu.id === r.menu_id);
                    const name = m ? m.name : 'その他';
                    map[name] = (map[name] || 0) + Number(r.price || 0);
                });
                return map;
            }, [completedResvs, menus]);

            // Chart Render
            useEffect(() => {
                if (!chartRef.current) return;
                const ctx = chartRef.current.getContext('2d');
                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }

                const labels = Object.keys(menuSalesBreakdown);
                const dataValues = Object.values(menuSalesBreakdown);

                chartInstance.current = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: labels.length > 0 ? labels : ['データなし'],
                        datasets: [{
                            data: dataValues.length > 0 ? dataValues : [1],
                            backgroundColor: ['#99633F', '#CDA282', '#4D3321', '#E1D3C1', '#7B4C2F', '#2C1B10'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { position: 'bottom' }
                        }
                    }
                });

                return () => {
                    if (chartInstance.current) chartInstance.current.destroy();
                };
            }, [menuSalesBreakdown]);

            const getCustomerName = (id) => customers.find(c => c.id === id)?.name || '未登録';
            const getMenuName = (id) => menus.find(m => m.id === id)?.name || '未登録';

            return (
                <div className="space-y-6">
                    {/* KPI Cards */}
                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-6">
                        <div className="bg-white p-5 rounded-2xl border border-stone-200/80 shadow-sm">

                            <span className="text-2xl sm:text-3xl font-extrabold text-stone-900 mt-2 block">{formatYen(todaySales)}</span>
                        </div>
                        <div className="bg-white p-5 rounded-2xl border border-stone-200/80 shadow-sm">
                            <span className="text-xs font-semibold text-stone-400 block uppercase">今月の売上 (10月)</span>
                            <span className="text-2xl sm:text-3xl font-extrabold text-salon-600 mt-2 block">{formatYen(monthSales)}</span>
                        </div>
                        <div className="bg-white p-5 rounded-2xl border border-stone-200/80 shadow-sm">
                            <span className="text-xs font-semibold text-stone-400 block uppercase">今月の来店人数</span>
                            <span className="text-2xl sm:text-3xl font-extrabold text-stone-800 mt-2 block">{monthVisits} 名</span>
                        </div>
                        <div className="bg-white p-5 rounded-2xl border border-stone-200/80 shadow-sm">
                            <span className="text-xs font-semibold text-stone-400 block uppercase">平均客単価</span>
                            <span className="text-2xl sm:text-3xl font-extrabold text-stone-800 mt-2 block">{formatYen(avgCustomerSpend)}</span>
                        </div>
                    </div>

                    {/* Chart and Detail Breakdown */}
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="bg-white p-6 rounded-2xl border border-stone-200/80 shadow-sm flex flex-col justify-between">
                            <h3 className="font-bold text-stone-800 text-sm mb-4">メニュー別売上構成比</h3>
                            <div className="w-full max-w-[260px] mx-auto py-4">
                                <canvas ref={chartRef}></canvas>
                            </div>
                        </div>

                        {/* Recent Completed Sales Table */}
                        <div className="lg:col-span-2 bg-white rounded-2xl border border-stone-200/80 shadow-sm p-6">
                            <h3 className="font-bold text-stone-800 text-sm mb-4">会計済み売上履歴</h3>

                        </div>
                    </div>
                </div>
            );
        }
