        function ReservationFormModal({ customers, menus, reservations, settings, preselectedCustomer, onClose, onSave, onAddNewCustomerInline }) {
            const [customerId, setCustomerId] = useState(preselectedCustomer ? preselectedCustomer.id : (customers[0]?.id || ''));
            const [menuId, setMenuId] = useState(menus[0]?.id || '');
            const [date, setDate] = useState(TODAY_STR);
            const [startTime, setStartTime] = useState('10:00');
            const [duration, setDuration] = useState(menus[0]?.duration || 60);
            const [price, setPrice] = useState(menus[0]?.price || 4000);
            const [status, setStatus] = useState('予約済み');
            const [memo, setMemo] = useState('');
            const [errorMessage, setErrorMessage] = useState('');

            // Inline Add Customer State
            const [showInlineCust, setShowInlineCust] = useState(false);
            const [inlineName, setInlineName] = useState('');
            const [inlinePhone, setInlinePhone] = useState('');

            // Menu selection auto-fills duration and price
            const handleMenuChange = (mId) => {
                setMenuId(mId);
                const selectedM = menus.find(m => m.id === mId);
                if (selectedM) {
                    setPrice(selectedM.price);
                    setDuration(selectedM.duration);
                }
            };

            // Calculated End Time
            const endTime = useMemo(() => {
                const startMin = timeToMinutes(startTime);
                return minutesToTime(startMin + Number(duration));
            }, [startTime, duration]);

            // Save Handler with Validation Rules
            const handleSubmit = (e) => {
                e.preventDefault();
                setErrorMessage('');

                // 1. Validation: Customer required
                if (!customerId) {
                    setErrorMessage('顧客を選択してください。');
                    return;
                }

                // 2. Validation: Store Hours Check
                const startMin = timeToMinutes(startTime);
                const endMin = timeToMinutes(endTime);
                const openMin = timeToMinutes(settings.openTime);
                const closeMin = timeToMinutes(settings.closeTime);

                if (startMin < openMin || endMin > closeMin) {
                    setErrorMessage(`予約時間が営業時間 (${settings.openTime}〜${settings.closeTime}) の外になっています。`);
                    return;
                }

                // 3. Validation: Overlap Check
                const isOverlapping = reservations.some(r => {
                    if (r.reservation_date !== date) return false;
                    if (r.status === 'キャンセル') return false;

                    const existingStart = timeToMinutes(r.start_time);
                    const existingEnd = timeToMinutes(r.end_time);

                    // Overlap logic: (StartA < EndB) && (EndA > StartB)
                    return (startMin < existingEnd) && (endMin > existingStart);
                });

                if (isOverlapping) {
                    setErrorMessage('この時間帯には既に予約が入っています。別の時間を選択してください。');
                    return;
                }

                onSave({
                    customer_id: customerId,
                    menu_id: menuId,
                    reservation_date: date,
                    start_time: startTime,
                    end_time: endTime,
                    price: Number(price),
                    status,
                    memo
                });
            };

            const handleInlineCustSubmit = (e) => {
                e.preventDefault();
                if (!inlineName.trim()) return;
                const created = onAddNewCustomerInline({ name: inlineName, phone: inlinePhone });
                setCustomerId(created.id);
                setShowInlineCust(false);
            };

            return (
                <div className="fixed inset-0 z-50 bg-stone-900/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
                    <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl my-8">
                        <div className="flex justify-between items-center pb-3 border-b border-stone-100">
                            <h3 className="font-bold text-lg text-stone-900">新規予約の登録</h3>
                            <button onClick={onClose} className="text-stone-400 hover:text-stone-600">
                                <i data-lucide="x" className="w-5 h-5"></i>
                            </button>
                        </div>

                        {errorMessage && (
                            <div className="mt-4 p-3 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-xl flex items-center space-x-2">
                                <i data-lucide="alert-circle" className="w-4 h-4 shrink-0"></i>
                                <span>{errorMessage}</span>
                            </div>
                        )}

                        <form onSubmit={handleSubmit} className="mt-4 space-y-4">
                            {/* Customer Select / Inline Add */}
                            <div>
                                <div className="flex justify-between items-center mb-1">
                                    <label className="block text-xs font-bold text-stone-700">顧客選択 <span className="text-rose-500">*</span></label>
                                    <button 
                                        type="button" 
                                        onClick={() => setShowInlineCust(!showInlineCust)}
                                        className="text-[11px] font-semibold text-salon-600 hover:text-salon-800"
                                    >
                                        {showInlineCust ? '既存顧客一覧に戻る' : '+ その場で新規顧客登録'}
                                    </button>
                                </div>

                                {showInlineCust ? (
                                    <div className="p-3 bg-stone-50 rounded-xl border border-stone-200 space-y-2">
                                        <input 
                                            type="text" 
                                            placeholder="顧客氏名" 
                                            value={inlineName} 
                                            onChange={e => setInlineName(e.target.value)}
                                            className="w-full px-3 py-1.5 border border-stone-200 rounded-lg text-xs"
                                        />
                                        <input 
                                            type="tel" 
                                            placeholder="電話番号" 
                                            value={inlinePhone} 
                                            onChange={e => setInlinePhone(e.target.value)}
                                            className="w-full px-3 py-1.5 border border-stone-200 rounded-lg text-xs"
                                        />
                                        <button 
                                            type="button"
                                            onClick={handleInlineCustSubmit}
                                            className="w-full bg-stone-800 text-white text-xs py-1.5 rounded-lg font-semibold"
                                        >
                                            顧客を作成して選択
                                        </button>
                                    </div>
                                ) : (
                                    <select 
                                        value={customerId}
                                        onChange={e => setCustomerId(e.target.value)}
                                        className="w-full px-3 py-2 border border-stone-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-salon-500"
                                    >
                                        {customers.map(c => (
                                            <option key={c.id} value={c.id}>{c.name} 様 ({c.phone || '電話不詳'})</option>
                                        ))}
                                    </select>
                                )}
                            </div>

                            {/* Menu Select */}
                            <div>
                                <label className="block text-xs font-bold text-stone-700 mb-1">施術メニュー <span className="text-rose-500">*</span></label>
                                <select 
                                    value={menuId}
                                    onChange={e => handleMenuChange(e.target.value)}
                                    className="w-full px-3 py-2 border border-stone-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-salon-500"
                                >
                                    {menus.map(m => (
                                        <option key={m.id} value={m.id}>{m.name} - {formatYen(m.price)} ({m.duration}分)</option>
                                    ))}
                                </select>
                            </div>

                            {/* Date & Start Time */}
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-bold text-stone-700 mb-1">予約日</label>
                                    <input 
                                        type="date" 
                                        required 
                                        value={date}
                                        onChange={e => setDate(e.target.value)}
                                        className="w-full px-3 py-2 border border-stone-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-salon-500"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-stone-700 mb-1">開始時間</label>
                                    <input 
                                        type="time" 
                                        required 
                                        value={startTime}
                                        onChange={e => setStartTime(e.target.value)}
                                        className="w-full px-3 py-2 border border-stone-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-salon-500"
                                    />
                                </div>
                            </div>

                            {/* Duration & Calculated End Time Display */}
                            <div className="grid grid-cols-2 gap-4 bg-stone-50 p-3 rounded-xl border border-stone-100">
                                <div>
                                    <label className="block text-[10px] font-bold text-stone-500 uppercase">所要時間 (分)</label>
                                    <input 
                                        type="number" 
                                        min="1" 
                                        value={duration}
                                        onChange={e => setDuration(Number(e.target.value))}
                                        className="w-full mt-1 px-2 py-1 border border-stone-200 rounded text-xs font-semibold"
                                    />
                                </div>
                                <div>
                                    <label className="block text-[10px] font-bold text-stone-500 uppercase">終了予定時刻</label>
                                    <div className="text-sm font-extrabold text-stone-800 mt-2 font-mono">
                                        {endTime}
                                    </div>
                                </div>
                            </div>

                            {/* Price & Status */}
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-bold text-stone-700 mb-1">料金 (円)</label>
                                    <input 
                                        type="number" 
                                        min="0"
                                        value={price}
                                        onChange={e => setPrice(Number(e.target.value))}
                                        className="w-full px-3 py-2 border border-stone-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-salon-500"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-stone-700 mb-1">ステータス</label>
                                    <select 
                                        value={status}
                                        onChange={e => setStatus(e.target.value)}
                                        className="w-full px-3 py-2 border border-stone-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-salon-500"
                                    >
                                        {['予約済み', '来店済み', '施術中', '会計済み', 'キャンセル'].map(s => (
                                            <option key={s} value={s}>{s}</option>
                                        ))}
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-stone-700 mb-1">メモ</label>
                                <textarea 
                                    rows="2" 
                                    value={memo}
                                    onChange={e => setMemo(e.target.value)}
                                    placeholder="施術時の要望など"
                                    className="w-full px-3 py-2 border border-stone-200 rounded-xl text-sm outline-none focus:ring-2 focus:ring-salon-500"
                                ></textarea>
                            </div>

                            <div className="pt-3 flex justify-end space-x-3 border-t border-stone-100">
                                <button 
                                    type="button" 
                                    onClick={onClose}
                                    className="px-4 py-2 bg-stone-100 text-stone-600 text-xs font-semibold rounded-xl"
                                >
                                    キャンセル
                                </button>
                                <button 
                                    type="submit"
                                    className="px-5 py-2 bg-salon-600 text-white text-xs font-semibold rounded-xl shadow hover:bg-salon-500"
                                >
                                    予約を確定する
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function ReservationDetailModal({ reservation, customers, menus, onClose, onStatusChange, onCancel, onNavigateToCustomer }) {
            const customer = customers.find(c => c.id === reservation.customer_id);
            const menu = menus.find(m => m.id === reservation.menu_id);

            return (
                <div className="fixed inset-0 z-50 bg-stone-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl animate-fade-in">
                        <div className="flex justify-between items-start pb-4 border-b border-stone-100">
                            <div>
                                <span className={`inline-block px-3 py-0.5 rounded-full text-xs font-bold border ${getStatusBadgeClass(reservation.status)}`}>
                                    {reservation.status}
                                </span>
                                <h3 className="font-bold text-lg text-stone-900 mt-2">予約詳細</h3>
                            </div>
                            <button onClick={onClose} className="text-stone-400 hover:text-stone-600">
                                <i data-lucide="x" className="w-5 h-5"></i>
                            </button>
                        </div>

                        <div className="py-4 space-y-4 text-xs">
                            {/* Customer Link */}
                            <div className="bg-stone-50 p-3.5 rounded-xl border border-stone-100 flex items-center justify-between">
                                <div>
                                    <span className="text-[10px] text-stone-400 block uppercase font-medium">お客様</span>
                                    <span className="font-bold text-stone-900 text-sm">{customer?.name || '不明'} 様</span>
                                    <span className="block text-stone-500 text-[11px] mt-0.5">📞 {customer?.phone || 'なし'}</span>
                                </div>
                                {customer && (
                                    <button 
                                        onClick={() => onNavigateToCustomer(customer.id)}
                                        className="text-salon-600 hover:text-salon-800 font-semibold bg-white border border-stone-200 px-3 py-1.5 rounded-lg text-[11px] shadow-sm"
                                    >
                                        顧客カルテへ
                                    </button>
                                )}
                            </div>

                            {/* Time & Menu Details */}
                            <div className="grid grid-cols-2 gap-3">
                                <div className="p-3 bg-stone-50 rounded-xl border border-stone-100">
                                    <span className="text-[10px] text-stone-400 block uppercase font-medium">予約日時</span>
                                    <span className="font-bold text-stone-800">{reservation.reservation_date}</span>
                                    <span className="block font-mono text-stone-600">{reservation.start_time} - {reservation.end_time}</span>
                                </div>
                                <div className="p-3 bg-stone-50 rounded-xl border border-stone-100">
                                    <span className="text-[10px] text-stone-400 block uppercase font-medium">料金</span>
                                    <span className="font-extrabold text-stone-900 text-sm">{formatYen(reservation.price)}</span>
                                </div>
                            </div>

                            <div className="p-3 bg-stone-50 rounded-xl border border-stone-100">
                                <span className="text-[10px] text-stone-400 block uppercase font-medium">施術メニュー</span>
                                <span className="font-bold text-stone-800">{menu?.name || '不明メニュー'}</span>
                            </div>

                            {reservation.memo && (
                                <div className="p-3 bg-amber-50/50 rounded-xl border border-amber-200/60">
                                    <span className="text-[10px] text-amber-800 font-bold block">メモ</span>
                                    <span className="text-stone-700">{reservation.memo}</span>
                                </div>
                            )}
                        </div>

                        {/* Status Change Buttons */}
                        <div className="pt-2 border-t border-stone-100 space-y-2">
                            <span className="text-[11px] font-bold text-stone-500 block">ステータスを変更:</span>
                            <div className="grid grid-cols-3 gap-2">
                                {['来店済み', '施術中', '会計済み'].map(st => (
                                    <button 
                                        key={st}
                                        onClick={() => onStatusChange(reservation.id, st)}
                                        className="py-2 bg-stone-100 hover:bg-stone-200 text-stone-800 font-bold rounded-xl text-xs transition"
                                    >
                                        {st}に
                                    </button>
                                ))}
                            </div>

                            <div className="flex justify-between items-center pt-3">
                                <button 
                                    onClick={() => {
                                        if (confirm('この予約をキャンセルしますか？')) {
                                            onCancel(reservation.id);
                                        }
                                    }}
                                    className="text-rose-600 hover:text-rose-800 font-semibold text-xs"
                                >
                                    予約をキャンセル
                                </button>

                                <button 
                                    onClick={onClose}
                                    className="px-4 py-2 bg-stone-900 text-white rounded-xl text-xs font-semibold"
                                >
                                    閉じる
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- RENDER APP ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
